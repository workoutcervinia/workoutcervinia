<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Cervinia - Booking</title>
  
  <!-- EmailJS SDK -->

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --danger: #ef4444;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px 15px; min-height: 100vh; }
    
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 1.8rem; margin-bottom: 8px; color: #fff; }
    header p { color: var(--subtext); font-size: 0.95rem; }

    .container { max-width: 500px; margin: 0 auto; display: grid; gap: 15px; }

    .step-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #334155;
    }

    .step-title {
      font-size: 1.05rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }

    .day-btn {
      padding: 14px 10px;
      background: #0f172a;
      border: 1px solid #475569;
      color: white;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .day-btn .day-label { font-size: 1.05rem; color: #38bdf8; }
    .day-btn .day-date { font-size: 0.85rem; color: var(--subtext); }

    .day-btn:hover:not(:disabled) { background: #334155; }
    .day-btn.selected { background: var(--accent); border-color: var(--accent); }
    .day-btn.selected .day-label, .day-btn.selected .day-date { color: #fff; }
    
    .day-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: transparent;
    }

    .slot-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .slot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }

    .time { font-size: 1.2rem; font-weight: bold; }
    .badge { background: #334155; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; }
    .badge.full { background: #991b1b; color: #fecaca; }

    .form-group { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); }

    .btn-submit {
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      background-color: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-submit:hover { background-color: var(--accent-hover); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .attendees-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .attendee-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .btn-cancel {
      background: transparent;
      color: var(--danger);
      padding: 2px 6px;
      font-size: 0.8rem;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

    <h1>Workout Cervinia 🏔️</h1>
    <p>Select day and time slot for upcoming workout sessions.</p>
  </header>

  <div class="container">
    <div class="step-card">
      <div class="step-title">Select Available Day</div>
      <div id="days-container" class="days-grid"></div>
    </div>

    <div id="slots-container"></div>
  </div>
